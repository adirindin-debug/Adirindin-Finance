<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>BTC 4-YEAR CYCLE MAP — @Dirindin533</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>:root{--bg:#000;--panel:#0a0a0a;--fg:#e8eef4;--muted:#9aa8b5;--accent:#3b82c4;--line:#222}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:1.25rem;margin:0 0 8px}.sub{color:var(--muted);font-size:12px;margin:0 0 16px}#chart{width:100%;height:720px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.note{color:var(--muted);font-size:11px;margin-top:12px}</style></head><body><div class="wrap"><h1>BTC 4-YEAR CYCLE MAP</h1><p class="sub">Observation-only · educational · @Dirindin533 · not investment advice · halvings marked</p><div id="chart"></div><p class="note">Live Coinbase BTC-USD. Halving markers approximate (2012/2016/2020/2024).</p></div>
<script>(async()=>{const halvings=["2012-11-28","2016-07-09","2020-05-11","2024-04-19"];const layout={paper_bgcolor:"#0a0a0a",plot_bgcolor:"#000",font:{color:"#e8eef4"},margin:{t:40,r:20,b:40,l:50},xaxis:{gridcolor:"#222"},yaxis:{gridcolor:"#222",title:"USD"},shapes:halvings.map(d=>({type:"line",x0:d,x1:d,y0:0,y1:1,yref:"paper",line:{color:"#3b82c4",width:1,dash:"dot"}})),annotations:halvings.map((d,i)=>({x:d,y:1,yref:"paper",text:"H"+(i+1),showarrow:false,font:{size:10,color:"#9aa8b5"},yshift:10}))};try{const r=await fetch("https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400");const rows=await r.json();rows.sort((a,b)=>a[0]-b[0]);const x=rows.map(d=>new Date(d[0]*1000).toISOString().slice(0,10));const y=rows.map(d=>d[4]);Plotly.newPlot("chart",[{x,y,type:"scatter",mode:"lines",line:{color:"#3b82c4"},name:"BTC-USD"}],layout,{responsive:true,displayModeBar:false});}catch(e){document.getElementById("chart").textContent="Chart data unavailable. BTC 4-YEAR map shell is live.";}})();</script></body></html>
